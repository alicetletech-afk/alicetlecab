<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文小卡片</title><style>
:root{--bg:#fffaf7;--ink:#252329;--muted:#817b86;--v:#8268d8;--line:#e9e2df}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#eee8ff,transparent 28%),radial-gradient(circle at 95% 8%,#ffe7ef,transparent 25%),var(--bg);color:var(--ink);font-family:Poppins,"Noto Sans Thai","Noto Sans SC",Arial,sans-serif}
.wrap{max-width:1080px;margin:auto;padding:40px 18px 70px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--v);text-transform:uppercase}
h1{font-size:clamp(34px,7vw,58px);margin:5px 0}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.tools{display:flex;gap:9px;margin-bottom:20px}.search{width:100%;border:1px solid var(--line);border-radius:15px;background:white;padding:13px 15px;font:inherit;outline:none}.count{white-space:nowrap;background:white;border:1px solid var(--line);border-radius:15px;padding:13px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}.card{aspect-ratio:1;border:1px solid var(--line);border-radius:21px;padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 8px 22px #3d2d4b0d;transition:.18s;background:#fff}
.card:nth-child(4n+1){background:#eee9ff}.card:nth-child(4n+2){background:#ffeaf1}.card:nth-child(4n+3){background:#eaf6ff}.card:nth-child(4n){background:#eaf8f1}.card:hover{transform:translateY(-3px)}
.zh{font-size:26px;font-weight:700;line-height:1.2}.py{font-size:10.5px;color:#655d6c;margin-top:8px}.th{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.modal{position:fixed;inset:0;background:#211c2860;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.sheet{width:min(560px,100%);background:white;border-radius:27px;padding:25px;position:relative;box-shadow:0 30px 80px #0003}.close{position:absolute;right:14px;top:14px;border:0;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.bigzh{font-size:38px;font-weight:700;padding-right:40px}.bigpy{font-size:14px;color:var(--v);font-weight:600;margin-top:7px}.bigth{font-size:14px;margin-top:6px}.label{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:23px 0 7px}.example{background:#faf7ff;border:1px solid #eae1ff;border-radius:17px;padding:16px}.exzh{font-size:20px;font-weight:600;line-height:1.5}.expy{font-size:12px;color:#716a76;margin-top:7px;line-height:1.5}.exth{font-size:13px;margin-top:7px;line-height:1.55}.empty{text-align:center;grid-column:1/-1;color:var(--muted);padding:35px}
@media(max-width:520px){.wrap{padding:27px 13px 50px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{border-radius:18px}.zh{font-size:22px}}

<script>const cards=[{"word": "有好感", "pinyin": "yǒu hǎogǎn", "meaning": "รู้สึกดี / มีใจให้", "example": "他对我只是有好感和喜欢，但是还没有到爱。", "examplePinyin": "Tā duì wǒ zhǐshì yǒu hǎogǎn hé xǐhuan, dànshì hái méiyǒu dào ài.", "exampleMeaning": "เขาแค่รู้สึกดีกับฉันและชอบฉัน แต่ยังไม่ถึงขั้นรัก"}, {"word": "暗恋", "pinyin": "ànliàn", "meaning": "แอบชอบ / แอบรัก", "example": "你那是暗恋，少往自己脸上贴金了。", "examplePinyin": "Nǐ nà shì ànliàn, shǎo wǎng zìjǐ liǎn shàng tiējīn le.", "exampleMeaning": "ของเธอนั่นมันแค่แอบรัก อย่ายกหางตัวเองนักเลย"}, {"word": "直觉", "pinyin": "zhíjué", "meaning": "สัญชาตญาณ / intuition", "example": "我的直觉挺准的吧？他们果然分手了！", "examplePinyin": "Wǒ de zhíjué tǐng zhǔn de ba? Tāmen guǒrán fēnshǒu le!", "exampleMeaning": "เซนส์ฉันแม่นใช่ไหมล่ะ? ว่าแล้ว พวกเขาเลิกกันจริง ๆ ด้วย!"}, {"word": "准", "pinyin": "zhǔn", "meaning": "แม่น / accurate", "example": "我的直觉挺准的吧？", "examplePinyin": "Wǒ de zhíjué tǐng zhǔn de ba?", "exampleMeaning": "เซนส์ฉันแม่นใช่ไหมล่ะ?"}, {"word": "果然", "pinyin": "guǒrán", "meaning": "ว่าแล้ว / เป็นอย่างที่คิด", "example": "他们果然分手了！", "examplePinyin": "Tāmen guǒrán fēnshǒu le!", "exampleMeaning": "พวกเขาเลิกกันจริง ๆ ด้วย!"}, {"word": "分手", "pinyin": "fēnshǒu", "meaning": "เลิกกัน", "example": "他要是知道我分手了，肯定会挺高兴的。", "examplePinyin": "Tā yàoshi zhīdào wǒ fēnshǒu le, kěndìng huì tǐng gāoxìng de.", "exampleMeaning": "ถ้าเขารู้ว่าฉันเลิกกับแฟนแล้ว เขาต้องดีใจแน่"}, {"word": "承诺", "pinyin": "chéngnuò", "meaning": "คำมั่น / commitment", "example": "他要是不给你承诺怎么办呢？", "examplePinyin": "Tā yàoshi bù gěi nǐ chéngnuò zěnme bàn ne?", "exampleMeaning": "ถ้าเขาไม่ให้ commitment กับเธอล่ะ จะทำยังไง?"}, {"word": "离婚", "pinyin": "líhūn", "meaning": "หย่า", "example": "我查过的，他离过婚。", "examplePinyin": "Wǒ cháguo de, tā líguo hūn.", "exampleMeaning": "ฉันเช็กมาแล้ว เขาเคยหย่ามาแล้ว"}, {"word": "陌生人", "pinyin": "mòshēngrén", "meaning": "คนแปลกหน้า", "example": "我只是不想让陌生男人来我家。", "examplePinyin": "Wǒ zhǐshì bù xiǎng ràng mòshēng nánrén lái wǒ jiā.", "exampleMeaning": "ฉันแค่ไม่อยากให้ผู้ชายแปลกหน้ามาที่บ้าน"}, {"word": "没准", "pinyin": "méizhǔn", "meaning": "ไม่แน่นะ / บางที", "example": "没准到时候是我先烦了。", "examplePinyin": "Méizhǔn dào shíhou shì wǒ xiān fán le.", "exampleMeaning": "ไม่แน่ถึงตอนนั้นฉันอาจเป็นฝ่ายเบื่อก่อน"}, {"word": "换我，我也……", "pinyin": "huàn wǒ, wǒ yě…", "meaning": "ถ้าเป็นฉัน ฉันก็…", "example": "换我我也开心。", "examplePinyin": "Huàn wǒ, wǒ yě kāixīn.", "exampleMeaning": "ถ้าเป็นฉัน ฉันก็ดีใจเหมือนกัน"}, {"word": "万一……怎么办？", "pinyin": "wànyī… zěnme bàn?", "meaning": "ถ้าเกิด…จะทำยังไง?", "example": "那万一你俩就变不成呢？", "examplePinyin": "Nà wànyī nǐ liǎ jiù biàn bu chéng ne?", "exampleMeaning": "แล้วถ้าเกิดพวกเธอสองคนไปกันไม่สำเร็จล่ะ?"}, {"word": "干嘛要……呢？", "pinyin": "gànmá yào… ne?", "meaning": "จะ…ไปทำไม?", "example": "我们俩什么都没有开始呢，干嘛要去想结果呢？", "examplePinyin": "Wǒmen liǎ shénme dōu hái méiyǒu kāishǐ ne, gànmá yào qù xiǎng jiéguǒ ne?", "exampleMeaning": "เรายังไม่ได้เริ่มอะไรกันเลย จะไปคิดถึงผลลัพธ์ทำไม?"}, {"word": "算了吧", "pinyin": "suàn le ba", "meaning": "ช่างมันเถอะ", "example": "算了吧，不说了。", "examplePinyin": "Suàn le ba, bù shuō le.", "exampleMeaning": "ช่างมันเถอะ ไม่พูดละ"}, {"word": "我先撤了", "pinyin": "wǒ xiān chè le", "meaning": "ฉันไปก่อนละ / เผ่นก่อน", "example": "我给你修完了啊，我先撤了啊。", "examplePinyin": "Wǒ gěi nǐ xiū wán le a, wǒ xiān chè le a.", "exampleMeaning": "ฉันซ่อมให้เสร็จแล้วนะ ฉันไปก่อนละ"}, {"word": "等会儿", "pinyin": "děnghuìr", "meaning": "เดี๋ยวก่อน / รอแป๊บ", "example": "等会儿，我跟你一起走。", "examplePinyin": "Děnghuìr, wǒ gēn nǐ yìqǐ zǒu.", "exampleMeaning": "เดี๋ยวก่อน ฉันไปกับเธอด้วย"}, {"word": "撕破脸", "pinyin": "sīpò liǎn", "meaning": "แตกหักแบบไม่ไว้หน้า", "example": "我上回那是悄悄地避开的，我又没撕破脸。", "examplePinyin": "Wǒ shàng huí nà shì qiāoqiāo de bìkāi de, wǒ yòu méi sīpò liǎn.", "exampleMeaning": "ครั้งก่อนฉันแค่หลบออกมา ฉันไม่ได้แตกหักกับเขาสักหน่อย"}, {"word": "吊着某人", "pinyin": "diàozhe mǒurén", "meaning": "ยื้อใครไว้ / keep someone hanging", "example": "他们吊着我，我也可以吊着他们呀。", "examplePinyin": "Tāmen diàozhe wǒ, wǒ yě kěyǐ diàozhe tāmen ya.", "exampleMeaning": "เขายื้อฉันไว้ ฉันก็ยื้อเขาไว้ได้เหมือนกัน"}, {"word": "接班", "pinyin": "jiēbān", "meaning": "รับช่วงต่อ", "example": "等他长大了，可以接班了。", "examplePinyin": "Děng tā zhǎngdà le, kěyǐ jiēbān le.", "exampleMeaning": "รอเขาโตจนรับช่วงต่อได้"}, {"word": "接班人", "pinyin": "jiēbānrén", "meaning": "ผู้สืบทอด / successor", "example": "他以后可以做接班人。", "examplePinyin": "Tā yǐhòu kěyǐ zuò jiēbānrén.", "exampleMeaning": "ต่อไปเขาสามารถเป็นผู้สืบทอดได้"}, {"word": "夺权", "pinyin": "duóquán", "meaning": "ยึด / แย่งอำนาจ", "example": "一边慢慢地从思维集团夺权。", "examplePinyin": "Yìbiān mànmàn de cóng Sīwéi Jítuán duóquán.", "exampleMeaning": "พร้อมกับค่อย ๆ แย่งอำนาจจากกลุ่มบริษัท"}, {"word": "山人自有妙计", "pinyin": "shānrén zì yǒu miàojì", "meaning": "ฉันมีแผนเด็ดของฉันน่า", "example": "山人自有妙计。", "examplePinyin": "Shānrén zì yǒu miàojì.", "exampleMeaning": "ฉันมีแผนของฉันน่า"}, {"word": "说曹操，曹操到", "pinyin": "shuō Cáo Cāo, Cáo Cāo dào", "meaning": "พูดถึงปุ๊บ โผล่มาปั๊บ", "example": "哟，说曹操，曹操到。", "examplePinyin": "Yō, shuō Cáo Cāo, Cáo Cāo dào.", "exampleMeaning": "โอ้ พูดถึงปุ๊บก็มาพอดี"}, {"word": "往自己脸上贴金", "pinyin": "wǎng zìjǐ liǎn shàng tiējīn", "meaning": "ยกยอตัวเอง / ทำให้ตัวเองดูดี", "example": "少往自己脸上贴金了。", "examplePinyin": "Shǎo wǎng zìjǐ liǎn shàng tiējīn le.", "exampleMeaning": "เลิกยกหางตัวเองได้แล้ว"}, {"word": "泼冷水", "pinyin": "pō lěngshuǐ", "meaning": "ดับฝัน / บั่นทอนกำลังใจ", "example": "你可别怪我泼你冷水啊。", "examplePinyin": "Nǐ kě bié guài wǒ pō nǐ lěngshuǐ a.", "exampleMeaning": "อย่าหาว่าฉันดับฝันเธอนะ"}, {"word": "欲罢不能", "pinyin": "yù bà bù néng", "meaning": "อยากหยุดแต่หยุดไม่ได้", "example": "早晚有一天，我会成为一个让他欲罢不能的女人。", "examplePinyin": "Zǎowǎn yǒu yì tiān, wǒ huì chéngwéi yí ge ràng tā yù bà bù néng de nǚrén.", "exampleMeaning": "สักวันฉันจะเป็นผู้หญิงที่ทำให้เขาหยุดหลงไม่ได้"}, {"word": "曾经沧海难为水", "pinyin": "céngjīng cānghǎi nán wéi shuǐ", "meaning": "เคยพบสิ่งที่ดีที่สุดแล้ว สิ่งอื่นยากจะเทียบ", "example": "曾经沧海难为水。", "examplePinyin": "Céngjīng cānghǎi nán wéi shuǐ.", "exampleMeaning": "เมื่อเคยเห็นทะเลกว้างแล้ว น้ำที่อื่นก็ยากจะเทียบ"}, {"word": "论……", "pinyin": "lùn…", "meaning": "ถ้าว่ากันในเรื่อง…", "example": "论长相，论能力，论家世，样样不差。", "examplePinyin": "Lùn zhǎngxiàng, lùn nénglì, lùn jiāshì, yàngyàng bù chà.", "exampleMeaning": "จะว่าหน้าตา ความสามารถ หรือพื้นฐานครอบครัว ก็ไม่ด้อยสักอย่าง"}, {"word": "样样不差", "pinyin": "yàngyàng bù chà", "meaning": "ไม่ด้อยสักด้าน", "example": "论长相，论能力，论家世，样样不差。", "examplePinyin": "Lùn zhǎngxiàng, lùn nénglì, lùn jiāshì, yàngyàng bù chà.", "exampleMeaning": "ทุกด้านถือว่าดี ไม่ได้ด้อยอะไรเลย"}, {"word": "警惕性十足", "pinyin": "jǐngtìxìng shízú", "meaning": "ระวังตัว / ตั้งการ์ดเต็มที่", "example": "别的男人接近你，你都警惕性十足。", "examplePinyin": "Bié de nánrén jiējìn nǐ, nǐ dōu jǐngtìxìng shízú.", "exampleMeaning": "เวลาผู้ชายคนอื่นเข้าหา เธอก็ตั้งการ์ดเต็มที่"}, {"word": "走得近", "pinyin": "zǒu de jìn", "meaning": "สนิท / ใกล้ชิดกับใคร", "example": "看徐迟和叶棋芝走得近了……", "examplePinyin": "Kàn Xú Chí hé Yè Qízhī zǒu de jìn le…", "exampleMeaning": "พอเห็นสองคนนั้นสนิทกันมากขึ้น…"}, {"word": "重男轻女", "pinyin": "zhòng nán qīng nǚ", "meaning": "ให้ความสำคัญลูกชายมากกว่าลูกสาว", "example": "你之前一直跟我们讲说你家里重男轻女。", "examplePinyin": "Nǐ zhīqián yìzhí gēn wǒmen jiǎng shuō nǐ jiālǐ zhòng nán qīng nǚ.", "exampleMeaning": "ก่อนหน้านี้เธอบอกเรามาตลอดว่าที่บ้านให้ค่าลูกชายมากกว่าลูกสาว"}, {"word": "催", "pinyin": "cuī", "meaning": "เร่ง / ตาม", "example": "从来没有听你提起过说他们催你结婚啊。", "examplePinyin": "Cónglái méiyǒu tīng nǐ tíqǐguo shuō tāmen cuī nǐ jiéhūn a.", "exampleMeaning": "ไม่เคยได้ยินเธอพูดว่าพวกเขาเร่งให้เธอแต่งงาน"}, {"word": "催婚", "pinyin": "cuīhūn", "meaning": "เร่ง / กดดันให้แต่งงาน", "example": "他们催你结婚。", "examplePinyin": "Tāmen cuī nǐ jiéhūn.", "exampleMeaning": "พวกเขาเร่งให้เธอแต่งงาน"}, {"word": "提起", "pinyin": "tíqǐ", "meaning": "เอ่ยถึง / พูดถึง", "example": "从来没有听你提起过。", "examplePinyin": "Cónglái méiyǒu tīng nǐ tíqǐguo.", "exampleMeaning": "ไม่เคยได้ยินเธอเอ่ยถึงมาก่อน"}, {"word": "家世", "pinyin": "jiāshì", "meaning": "พื้  "明天上午十点公司约了专家开视频会。", "examplePinyin": "Míngtiān shàngwǔ shí diǎn gōngsī yuē le zhuānjiā kāi shìpín huì.", "exampleMeaning": "พรุ่งนี้สิบโมงบริษัทนัดผู้เชี่ยวชาญประชุมวิดีโอ"}, {"word": "专家", "pinyin": "zhuānjiā", "meaning": "ผู้เชี่ยวชาญ", "example": "公司约了专家开视频会。", "examplePinyin": "Gōngsī yuē le zhuānjiā kāi shìpín huì.", "exampleMeaning": "บริษัทนัดผู้เชี่ยวชาญมาประชุมวิดีโอ"}, {"word": "提问", "pinyin": "tíwèn", "meaning": "ตั้งคำถาม", "example": "需要现场提问的人都可以参加。", "examplePinyin": "Xūyào xiànchǎng tíwèn de rén dōu kěyǐ cānjiā.", "exampleMeaning": "คนที่ต้องการถามคำถามใน session สามารถเข้าร่วมได้"}, {"word": "参加", "pinyin": "cānjiā", "meaning": "เข้าร่วม", "example": "需要现场提问的人都可以参加。", "examplePinyin": "Xūyào xiànchǎng tíwèn de rén dōu kěyǐ cānjiā.", "exampleMeaning": "คนที่ต้องการถามคำถามสามารถเข้าร่วมได้"}];const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),modal=document.getElementById('modal');
function render(q=''){let s=q.trim().toLowerCase(),a=cards.filter(c=>Object.values(c).join(' ').toLowerCase().includes(s));count.textContent=a.length;grid.innerHTML='';if(!a.length){grid.innerHTML='<div class="empty">ไม่เจอคำนี้ในกรุ</div>';return}a.forEach(c=>{let x=document.createElement('article');x.className='card';x.innerHTML=`<div class="zh">${c.word}</div><div class="py">${c.pinyin}</div><div class="th">${c.meaning}</div>`;x.onclick=()=>openCard(c);grid.appendChild(x)})}
function openCard(c){mw.textContent=c.word;mp.textContent=c.pinyin;mm.textContent=c.meaning;me.textContent=c.example;mep.textContent=c.examplePinyin;mem.textContent=c.exampleMeaning;modal.classList.add('open')}
function closeM(){modal.classList.remove('open')}search.oninput=e=>render(e.target.value);document.getElementById('close').onclick=closeM;modal.onclick=e=>{if(e.target===modal)closeM()};document.onkeydown=e=>{if(e.key==='Escape')closeM()};render();</script></body></html>
